# Builds the documentation site and publishes it to GitHub Pages.
# It runs when a change to the docs or the site settings reaches the main branch,
# and it can also be started manually from the repository's Actions tab.
# Pages is set to deploy from GitHub Actions, so the built site is uploaded and
# deployed here. That is what attaches the site address to the run. No commit
# is made, so the Actions bot is not an author of the site.
name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# The deploy job publishes through GitHub Pages. It only needs to read the
# repository. pages and id-token are what the Pages deploy action requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Two deploys at the same time would publish over each other. A newer run waits
# for the one already running to finish.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # MkDocs and the Material theme are only for the docs, so they are not in
      # requirements.txt. These exact versions are the ones used to write the docs,
      # so the site is built the same way here.
      - name: Install MkDocs and the Material theme
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7 pymdown-extensions==12.0.1

      # A strict build stops on a broken link or section link, so a bad page
      # never reaches the published site.
      - name: Build the site in strict mode
        run: mkdocs build --strict

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
