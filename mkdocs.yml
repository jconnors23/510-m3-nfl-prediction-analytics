site_name: NFL Prediction Analytics
# The published address on GitHub Pages (https://<user>.github.io/<repository>/), and the
# repository the site links back to.
site_url: https://jconnors23.github.io/510-m3-nfl-prediction-analytics/
repo_url: https://github.com/jconnors23/510-m3-nfl-prediction-analytics
repo_name: 510-m3-nfl-prediction-analytics
site_author: Josiah Connors
site_description: Pre-game NFL matchup prediction. A reproducible machine learning pipeline, served through an AWS API and a Vite web app.
copyright: NFL Prediction Analytics is a coursework project in sports analytics and machine learning. It is not affiliated with or endorsed by the National Football League.

theme:
  name: material
  # A light and a dark scheme in the web app's colors (white, black, purple,
  # orange, gold, silver, and amber). The site starts in the reader's system
  # setting, and the toggle in the header switches between the two. The exact
  # colors and the Oswald headline font are in stylesheets/extra.css (the
  # "custom" values below point there).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/football
  favicon: assets/favicon.svg
  features:
    - navigation.top
    - navigation.sections
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  # Turns "- [x]" and "- [ ]" into checkboxes, used for the status lists on the phase pages.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Warn on broken links and broken section anchors, so a strict build catches them.
validation:
  links:
    anchors: warn

# The overview (the README's summary, where the data comes from, and how the project was built)
# comes first, then the design manifest: how the project was built with AI tools, with choices and why. Then the Developer
# Docs: Version 1 (one page per phase: its overview, development guide, and implementation),
# the system design, local development, and the two deployment guides. Last, the Extras: the
# requirements rubric, the project requirements, the glossary, and the release notes.
nav:
  - Overview: index.md
  - Design Manifest: implementation/design-manifest.md
  # Pages for someone working on the code: how version 1 was built, one page per phase, how the
  # system fits together, how to set it up, run it, and test it, and how to deploy it.
  - Developer Docs:
      - Version 1:
          - "Phase 1: Data Pipeline": implementation/phase-1/index.md
          - "Phase 2: Features, Training, and Tracking": implementation/phase-2/index.md
          - "Phase 3: Local Prediction API": implementation/phase-3/index.md
          - "Phase 4: AWS Deployment": implementation/phase-4/index.md
          - "Phase 5: Front-End Web App": implementation/phase-5/index.md
          - "Phase 6: Docker": implementation/phase-6/index.md
          - "Phase 7: Review": implementation/phase-7/index.md
      - System Design:
          - Cloud Architecture: implementation/extras/architecture/cloud-architecture.md
          - ML Workflow: implementation/extras/architecture/ml-workflow.md
          - Frontend and Backend Connection: implementation/extras/architecture/frontend-backend-connection.md
      - Local Development:
          - Running Locally: implementation/extras/development/running-locally.md
          - Makefile: implementation/extras/development/makefile.md
          - Tooling Guide: implementation/extras/development/tooling-guide.md
          - Testing Guide: implementation/extras/development/testing-guide.md
          - GitHub Workflows: implementation/extras/development/github-workflows.md
      - Deployment:
          - Deploy the API: implementation/phase-4/deployment-guide.md
          - Deploy the Web App: implementation/phase-5/deployment-guide.md
  - Extras:
      - Requirements Rubric: implementation/requirements/requirements-rubric.md
      - Project Requirements: implementation/requirements/project-requirements.md
      - Glossary: implementation/extras/glossary.md
      - Release Notes:
          - Version 1.0: implementation/extras/release-notes/version-1-0.md
          - Future Considerations: implementation/extras/release-notes/future-considerations.md
