[pytest]
# Lets the tests import the project code (for example "from src.model.features import ...")
# without installing the project as a package.
pythonpath = .
# MLflow's own database code uses a SQLAlchemy option that SQLAlchemy plans to remove. The
# warning comes from inside MLflow, not from this project, so this one line hides it
# instead of showing it on every test run. Every other warning is still shown.
# Mangum's adapter asks asyncio for the current event loop in a way that Python 3.12 and
# later deprecate. Both warnings come from inside those packages, not this project, so
# each is hidden by its own line, and every other warning is still shown.
filterwarnings =
    ignore:The ``noload`` loader strategy:DeprecationWarning
    ignore:There is no current event loop:DeprecationWarning
